name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backup_panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backup_panel/requirements.txt
      - name: install
        run: pip install -r requirements.txt ruff==0.17.3
      - name: lint
        run: |
          ruff check . ../scripts
          ruff format --check . ../scripts
      - name: colour contrast (WCAG 4.5:1)
        run: python ../scripts/check_contrast.py
      - name: django checks
        env:
          DJANGO_DEBUG: "1"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: django deploy checks
        env:
          DJANGO_SECRET_KEY: ci-only-not-secret-ci-only-not-secret-ci-only-not-secret
          DJANGO_ALLOWED_HOSTS: backup.example.com
          TRUSTED_PROXY_COUNT: "1"
          DJANGO_HSTS_SECONDS: "3600"
        run: python manage.py check --deploy --fail-level WARNING
      - name: tests
        env:
          DJANGO_SECRET_KEY: ci-only-not-secret
        run: python manage.py test

  # The panel against a real Docker daemon and the real odoo-backup-service image (see panel/tests/test_contract.py).
  contract:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backup_panel/requirements.txt
      - run: pip install -r backup_panel/requirements.txt
      - name: contract tests
        working-directory: backup_panel
        env:
          DJANGO_SECRET_KEY: ci-only-not-secret
          PANEL_CONTRACT_TESTS: "1"
        run: python manage.py test panel.tests.test_contract -v 2
